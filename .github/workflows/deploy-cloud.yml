name: deploy-cloud

on:
  push:
    branches: [main]
    paths:
      - "function_app.py"
      - "host.json"
      - "cloud/**"
      - "pso2boost/**"
      - "cloud/requirements.txt"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run tests
        run: |
          python -m pip install -r requirements.txt -r cloud/requirements.txt pytest
          python -m pytest -q

  deploy:
    needs: test
    # AZURE_FUNCTIONAPP_NAME が未設定なら失敗せずスキップする
    if: vars.AZURE_FUNCTIONAPP_NAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 依存はデプロイ時にリモートビルド（Oryx）で入れるので、
      # ランナー上での pip install は不要
      - name: Build package
        run: |
          mkdir -p build
          cp function_app.py host.json build/
          cp -r pso2boost cloud build/
          # リモートビルドは zip 直下の requirements.txt を見るため、
          # セルフホスト用 + Functions 用を合わせて1枚にする
          cat requirements.txt cloud/requirements.txt > build/requirements.txt

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # プランを判別してビルド方法を選ぶ（Flex と従来でパラメータが違う）。
      # App Service Plan の読み取りは Website Contributor の権限外、
      # サブスクリプション一覧もオブジェクトスコープでは空になるため、
      # サイト自身の properties.sku（FlexConsumption / Dynamic）を
      # az functionapp show で読む（AZURE_RESOURCE_GROUP 推奨、無ければ一覧へフォールバック）。
      # - Flex Consumption: remote-build（Oryx）。scm-do-build 系は使わない
      # - 従来の Consumption: scm-do-build-during-deployment + enable-oryx-build
      - name: Detect hosting plan
        id: plan
        run: |
          set -euo pipefail
          app="${{ vars.AZURE_FUNCTIONAPP_NAME }}"
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          if [ -n "$rg" ]; then
            sku=$(az functionapp show --name "$app" --resource-group "$rg" --query "properties.sku" -o tsv)
          else
            sku=$(az functionapp list --query "[?name=='${app}'].properties.sku | [0]" -o tsv)
          fi
          if [ -z "$sku" ] || [ "$sku" = "None" ]; then
            echo "関数アプリ '${app}' が見つかりません" >&2
            exit 1
          fi
          echo "site sku: ${sku}"
          if [ "${sku,,}" = "flexconsumption" ]; then
            echo "flex=true" >> "$GITHUB_OUTPUT"
          else
            echo "flex=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: build
          remote-build: ${{ steps.plan.outputs.flex == 'true' }}
          scm-do-build-during-deployment: ${{ steps.plan.outputs.flex != 'true' }}
          enable-oryx-build: ${{ steps.plan.outputs.flex != 'true' }}

      - name: Verify health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://${AZURE_FUNCTIONAPP_NAME}.azurewebsites.net/api/health"; then
              exit 0
            fi
            sleep 15
          done
          echo "health check failed" >&2
          exit 1
        env:
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
