name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "cloud/commands.py"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Worker tests
        run: node --test cloudflare/*.test.js

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          secrets: |
            DISCORD_PUBLIC_KEY
        env:
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}

      # ここから先は「デプロイ後の Discord 側設定」の自動化。
      # Interaction Endpoint URL は保存前に Discord が署名付き PING を
      # 送って検証するため、Worker のデプロイ完了後に実行する。
      - name: Warn when Discord post-deploy config is skipped
        if: vars.AZURE_FUNCTIONAPP_NAME == ''
        run: echo "::warning::AZURE_FUNCTIONAPP_NAME が未設定のため Discord 側設定（endpoint / コマンド登録）をスキップします"

      - name: Azure login
        if: vars.AZURE_FUNCTIONAPP_NAME != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Discord app (endpoint + /setup command)
        if: vars.AZURE_FUNCTIONAPP_NAME != ''
        env:
          ENDPOINT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          url="${ENDPOINT_URL%/}"
          app="${{ vars.AZURE_FUNCTIONAPP_NAME }}"
          rg="${{ vars.AZURE_RESOURCE_GROUP }}"
          # 必要な2値だけを取得する（接続文字列などをシェル変数へ積まない）
          if [ -n "$rg" ]; then
            token=$(az functionapp config appsettings list --name "$app" --resource-group "$rg" --query "[?name=='DISCORD_BOT_TOKEN'].value" -o tsv)
            app_id=$(az functionapp config appsettings list --name "$app" --resource-group "$rg" --query "[?name=='DISCORD_APPLICATION_ID'].value" -o tsv)
          else
            token=$(az functionapp config appsettings list --name "$app" --query "[?name=='DISCORD_BOT_TOKEN'].value" -o tsv)
            app_id=$(az functionapp config appsettings list --name "$app" --query "[?name=='DISCORD_APPLICATION_ID'].value" -o tsv)
          fi
          if [ -z "$token" ] || [ -z "$app_id" ]; then
            echo "::error::Azure に DISCORD_BOT_TOKEN / DISCORD_APPLICATION_ID がありません"
            exit 1
          fi
          echo "::add-mask::$token"
          case "$url" in
            https://*) ;;
            *) echo "::error::wrangler-action から Worker URL が取得できませんでした" ; exit 1 ;;
          esac

          # Worker が先にデプロイ済みなので、署名付き PING の検証に通る。
          # -f がないと curl は HTTP 4xx/5xx でも終了コード 0 を返すため必須。
          response=$(curl -fsS -X PATCH "https://discord.com/api/v10/applications/@me" \
            -H "Authorization: Bot $token" \
            -H "Content-Type: application/json" \
            -d "{\"interactions_endpoint_url\":\"$url\"}") || {
              echo "::error::Discord の Interactions Endpoint URL 設定に失敗しました"
              exit 1
            }
          # PATCH レスポンスの形に依存せず、GET で実際の設定値を確認する
          current=$(curl -fsS "https://discord.com/api/v10/applications/@me" \
            -H "Authorization: Bot $token" | jq -r '.interactions_endpoint_url')
          [ "$current" = "$url" ] || {
            echo "::error::Discord 側の endpoint 設定が反映されていません (${current:-empty})"
            exit 1
          }

          # コマンド定義は cloud/commands.py の 1 箇所に集約する。
          # PEP 668 の externally-managed Python を避けるため venv を使う。
          python -m venv .venv-worker
          . .venv-worker/bin/activate
          python -m pip install --quiet requests
          DISCORD_BOT_TOKEN="$token" DISCORD_APPLICATION_ID="$app_id" python -m cloud.commands || {
            echo "::error::/setup コマンドの登録に失敗しました"
            exit 1
          }
